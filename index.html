<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Plataforma Manutenção 4.0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="appFrame" src="./gemini-code-1787600450210-v2.html?build=topnav-fixed-1" title="Plataforma Manutenção 4.0"></iframe>
<script>
(function(){
 const frame=document.getElementById('appFrame');
 function install(){
  try{
   const d=frame.contentDocument;
   if(!d||!d.body)return;
   const shell=[...d.body.children].find(el=>el.querySelector&&el.querySelector('aside')&&el.querySelector('main'));
   const aside=d.querySelector('aside');
   const main=d.querySelector('main');
   if(!shell||!aside||!main)return;

   // Layout superior: transforma o menu lateral original em uma barra horizontal.
   shell.style.cssText='display:block;min-height:calc(100vh - 4rem);';
   aside.style.cssText='width:100%;height:auto;min-height:0;box-sizing:border-box;border-right:0;border-bottom:1px solid #1e293b;padding:8px 12px;display:flex;align-items:center;gap:6px;background:#0b1220;position:sticky;top:64px;z-index:10;overflow-x:auto;';
   main.style.cssText='display:block;min-height:calc(100vh - 7rem);padding:22px 28px;box-sizing:border-box;overflow:auto;';
   const title=aside.querySelector('div');
   if(title)title.style.display='none';

   const nav=aside.querySelectorAll('.nav');
   const labels=['📊 Dashboard & KPIs','🏭 Cadastro de Ativos','📋 Abertura de O.S.','📦 Peças & Almoxarifado','🕘 Histórico & Relatórios'];
   const tabs=['dashboard','equipamentos','ordens','estoque','historico'];
   nav.forEach((b,i)=>{
     b.style.cssText='width:auto;flex:0 0 auto;padding:9px 14px;border-radius:6px;font-size:11px;white-space:nowrap;text-align:left;';
     if(labels[i]){
       const badge=b.querySelector('#badge');
       b.childNodes.forEach(n=>{if(n.nodeType===3)n.textContent='';});
       b.insertBefore(d.createTextNode(labels[i]+' '),b.firstChild);
       if(badge){badge.style.marginLeft='8px';}
     }
     b.onclick=function(ev){
       ev.preventDefault();
       const id=tabs[i];
       d.querySelectorAll('.tab').forEach(s=>s.classList.remove('active'));
       const target=d.getElementById(id);
       if(target)target.classList.add('active');
       d.querySelectorAll('aside .nav').forEach(x=>x.classList.remove('active'));
       b.classList.add('active');
       if(typeof d.defaultView.tab==='function')d.defaultView.tab(id);
     };
   });

   // Garante que somente a aba ativa fique visível.
   let style=d.getElementById('topNavLayoutFixed');
   if(!style){
     style=d.createElement('style');
     style.id='topNavLayoutFixed';
     style.textContent='.tab{display:none!important}.tab.active{display:block!important}@media(max-width:800px){main{padding:16px!important}aside .nav{font-size:10px!important;padding:8px 10px!important}}';
     d.head.appendChild(style);
   }

   if(!d.getElementById('excelLoader')){
     const s=d.createElement('script');s.id='excelLoader';s.src='./exportacao-xlsx.js?build=5';d.body.appendChild(s);
   }
  }catch(e){console.warn('Layout:',e)}
 }
 frame.addEventListener('load',()=>setTimeout(install,250));
 setTimeout(install,500);
 setInterval(install,3000);
})();
</script>
</body>
</html>
