<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Plataforma Manutenção 4.0</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="appFrame" src="./gemini-code-1787600450210-v2.html?build=excel-formatado-1" title="Plataforma Manutenção 4.0"></iframe>
<script>
(function(){
 const frame=document.getElementById('appFrame');
 function install(){
  try{
   const d=frame.contentDocument;
   if(!d||!d.body)return;
   if(d.getElementById('excelExportButton'))return;
   const section=d.getElementById('historico');
   if(!section)return;
   const heading=section.querySelector('h2');
   if(!heading)return;
   const btn=d.createElement('button');
   btn.id='excelExportButton';
   btn.textContent='📊 Exportar Excel formatado';
   btn.style.cssText='float:right;background:#16a34a;color:#fff;border:0;border-radius:7px;padding:8px 12px;font-weight:700;cursor:pointer;margin-top:-4px';
   heading.parentNode.insertBefore(btn,heading.nextSibling);
   const s=d.createElement('script');
   s.src='./exportacao-xlsx.js?build=1';
   d.body.appendChild(s);
  }catch(e){setTimeout(install,1000)}
 }
 frame.addEventListener('load',()=>setTimeout(install,300));
 setInterval(install,2000);
})();
</script>
</body>
</html>
