<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Plataforma Manutenção 4.0</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="appFrame" src="./gemini-code-1787600450210-v2.html?build=topnav-1" title="Plataforma Manutenção 4.0"></iframe>
<script>
(function(){
 const frame=document.getElementById('appFrame');
 function install(){
  try{
   const d=frame.contentDocument;
   if(!d||!d.body)return;
   if(!d.getElementById('topNavLayout')){
    const s=d.createElement('style');
    s.id='topNavLayout';
    s.textContent=`
      html,body{width:100%;min-height:100%;}
      body{overflow:auto!important}
      body>div.flex.min-h\\[calc\\(100vh-4rem\\)\\]{display:block!important;min-height:calc(100vh - 4rem)!important}
      body>div.flex.min-h\\[calc\\(100vh-4rem\\)\\]>aside{width:100%!important;height:auto!important;min-height:0!important;border-right:0!important;border-bottom:1px solid #1e293b!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:6px!important;background:#0b1220!important;position:sticky!important;top:64px!important;z-index:10!important}
      body>div.flex.min-h\\[calc\\(100vh-4rem\\)\\]>aside>div:first-child{display:none!important}
      body>div.flex.min-h\\[calc\\(100vh-4rem\\)\\]>aside .nav{width:auto!important;flex:0 0 auto!important;padding:9px 14px!important;border-radius:6px!important;font-size:11px!important;white-space:nowrap!important}
      body>div.flex.min-h\\[calc\\(100vh-4rem\\)\\]>aside .nav .float-right{margin-left:8px}
      body>div.flex.min-h\\[calc\\(100vh-4rem\\)\\]>main{min-height:calc(100vh - 7rem)!important;padding:22px 28px!important}
      @media(max-width:800px){body>div.flex.min-h\\[calc\\(100vh-4rem\\)\\]>aside{overflow-x:auto}.nav{font-size:10px!important;padding:8px 10px!important}body>div.flex.min-h\\[calc\\(100vh-4rem\\)\\]>main{padding:16px!important}}
    `;
    d.head.appendChild(s);
   }
   const nav=d.querySelectorAll('aside .nav');
   const labels=['📊 Dashboard & KPIs','🏭 Cadastro de Ativos','📋 Abertura de O.S.','📦 Peças & Almoxarifado','🕘 Histórico & Relatórios'];
   nav.forEach((b,i)=>{if(labels[i])b.innerHTML=labels[i]+(i===2?' <span id="badge" class="float-right">0</span>':'');});
   if(!d.getElementById('excelLoader')){
    const s=d.createElement('script');s.id='excelLoader';s.src='./exportacao-xlsx.js?build=4';d.body.appendChild(s);
   }
  }catch(e){setTimeout(install,700)}
 }
 frame.addEventListener('load',()=>setTimeout(install,300));
 setInterval(install,1500);
})();
</script>
</body>
</html>
